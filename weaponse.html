<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чёрный рынок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #121214;
      --line: #2a2a2e;
      --red: #ff2e3a;
      --amber: #ffb400;
      --text: #d9d6cf;
      --muted: #7d7a74;
      --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
      --type: "Special Elite", "Courier New", monospace;
      --mono: "Share Tech Mono", Consolas, "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #0a0a0b;
    }

    body {
      font-family: var(--mono);
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255, 46, 58, .14), transparent 55%),
        radial-gradient(ellipse at center, #121214 0%, var(--bg) 75%);
      background-attachment: fixed;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* зерно плёнки */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: .12;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* линии ЭЛТ-экрана */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 51;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px);
    }

    /* ---------- шапка ---------- */
    .tape {
      height: 16px;
      background: repeating-linear-gradient(-45deg, var(--amber) 0 16px, #0a0a0b 16px 32px);
      border-bottom: 1px solid #000;
    }

    header {
      text-align: center;
      padding: 54px 20px 40px;
      position: relative;
    }

    .kicker {
      font-family: var(--mono);
      font-size: 14px;
      letter-spacing: 6px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    header h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(54px, 11vw, 122px);
      line-height: .95;
      letter-spacing: 10px;
      color: #fff;
      text-shadow: 0 0 4px #fff, 0 0 12px var(--red), 0 0 34px var(--red), 0 0 70px rgba(255, 46, 58, .6);
      animation: flicker 6s infinite;
    }

    header h1 span {
      color: var(--red);
      text-shadow: 0 0 6px var(--red), 0 0 26px var(--red), 0 0 60px rgba(255, 46, 58, .7);
    }

    .tagline {
      margin-top: 18px;
      font-family: var(--type);
      font-size: 19px;
      color: var(--muted);
    }

    .tagline b {
      color: var(--amber);
      font-weight: 400;
    }

    @keyframes flicker {

      0%,
      18%,
      22%,
      62%,
      64%,
      100% {
        opacity: 1;
      }

      20%,
      63% {
        opacity: .55;
      }

      21% {
        opacity: .9;
      }
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 24px 40px;
    }

    /* ---------- панель поиска ---------- */
    .toolbar {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }

    .field {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0e0e10;
      border: 1px solid var(--line);
      border-left: 3px solid var(--red);
      padding: 0 18px;
    }

    .field:focus-within {
      border-color: var(--red);
      box-shadow: 0 0 0 1px var(--red), 0 0 24px rgba(255, 46, 58, .25);
    }

    .prompt {
      color: var(--red);
      font-size: 20px;
    }

    .field input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      font-family: var(--mono);
      font-size: 18px;
      color: var(--text);
      padding: 17px 0;
      caret-color: var(--red);
    }

    .field input::placeholder {
      color: #55534f;
    }

    select {
      font-family: var(--mono);
      font-size: 17px;
      color: var(--text);
      background: #0e0e10;
      border: 1px solid var(--line);
      padding: 0 18px;
      cursor: pointer;
      outline: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select:focus {
      border-color: var(--amber);
    }

    .count {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 26px 0 22px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .count::after {
      content: "";
      flex: 1;
      height: 1px;
      background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px);
    }

    .count b {
      color: var(--amber);
      font-weight: 400;
    }

    /* ---------- карточки ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 26px;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, #151517, #0f0f11);
      border: 1px solid var(--line);
      padding: 22px 24px 24px;
      display: flex;
      flex-direction: column;
      transition: transform .18s, border-color .18s, box-shadow .18s;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid var(--red);
      pointer-events: none;
      transition: all .18s;
    }

    .card::before {
      top: -1px;
      left: -1px;
      border-right: 0;
      border-bottom: 0;
    }

    .card::after {
      bottom: -1px;
      right: -1px;
      border-left: 0;
      border-top: 0;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #4a2226;
      box-shadow: 0 12px 34px rgba(0, 0, 0, .6), 0 0 28px rgba(255, 46, 58, .18);
    }

    .card:hover::before,
    .card:hover::after {
      width: 30px;
      height: 30px;
    }

    .lot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--amber);
      padding-bottom: 12px;
      margin-bottom: 18px;
      border-bottom: 1px dashed var(--line);
    }

    .lot em {
      font-style: normal;
      color: var(--muted);
      letter-spacing: 2px;
    }

    .card h2 {
      font-family: var(--display);
      font-weight: 400;
      font-size: 38px;
      line-height: 1.05;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chip {
      align-self: flex-start;
      margin: 10px 0 22px;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      border: 1px dashed #5b5852;
      padding: 4px 10px;
    }

    .price {
      margin-top: auto;
      font-family: var(--display);
      font-size: 50px;
      line-height: 1;
      letter-spacing: 2px;
      color: var(--amber);
      text-shadow: 0 0 14px rgba(255, 180, 0, .35);
    }

    .price small {
      font-size: 26px;
      color: #b9851a;
      margin-left: 6px;
    }

    .stock {
      margin-top: 16px;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stock.ok {
      color: #6fdc8c;
    }

    .stock.no {
      color: var(--red);
    }

    .card.out .body {
      opacity: .42;
      filter: grayscale(.8);
    }

    .stamp {
      position: absolute;
      right: 16px;
      bottom: 16px;
      transform: rotate(-9deg);
      font-family: var(--display);
      font-size: 24px;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--red);
      border: 3px solid var(--red);
      padding: 5px 10px;
      text-shadow: 0 0 10px rgba(255, 46, 58, .5);
      box-shadow: 0 0 14px rgba(255, 46, 58, .35), inset 0 0 10px rgba(255, 46, 58, .2);
      background: rgba(10, 10, 11, .55);
      pointer-events: none;
    }

    /* ---------- состояния ---------- */
    .state {
      text-align: center;
      padding: 60px 10px;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .state.loading::after {
      content: "_";
      color: var(--red);
      animation: blink 1s steps(1) infinite;
    }

    .state.error {
      color: var(--red);
    }

    .state small {
      display: block;
      margin-top: 14px;
      letter-spacing: 1px;
      text-transform: none;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .lock {
      max-width: 640px;
      margin: 40px auto;
      text-align: center;
      padding: 48px 28px;
      border: 2px solid var(--red);
      background: rgba(255, 46, 58, .05);
      box-shadow: 0 0 40px rgba(255, 46, 58, .2), inset 0 0 40px rgba(255, 46, 58, .06);
    }

    .lock h2 {
      font-family: var(--display);
      font-weight: 400;
      font-size: 56px;
      letter-spacing: 8px;
      color: var(--red);
      text-shadow: 0 0 20px rgba(255, 46, 58, .6);
    }

    .lock p {
      margin-top: 14px;
      font-family: var(--type);
      font-size: 18px;
      color: var(--text);
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 30px 20px 50px;
      color: #55534f;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .toolbar {
        flex-direction: column;
      }

      select {
        padding: 14px 18px;
      }

      header h1 {
        letter-spacing: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      header h1,
      .state.loading::after {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="tape"></div>

  <header>
    <h1>ЧЁРНЫЙ <span>РЫНОК</span></h1>
    <p class="tagline">Без вопросов. Без имён. <b>Товар — из базы Supabase.</b></p>
  </header>

  <main id="app">
    <div class="toolbar">
      <label class="field">
        <span class="prompt">&gt;_</span>
        <input id="search" type="text" placeholder="поиск по названию или типу..." autocomplete="off">
      </label>
      <select id="sort" aria-label="Сортировка">
        <option value="name">По названию</option>
        <option value="price">По цене</option>
        <option value="type">По типу</option>
      </select>
    </div>

    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <div class="state loading" id="state">Подключение к сети</div>
  </main>

  <footer>Учебный проект · все товары и данные вымышленные</footer>

  <script>
    // ===== НАСТРОЙКИ: вставьте свои данные из Supabase =====
    // Project Settings -> API: "Project URL" и ключ "anon public"
    const SUPABASE_URL = 'https://sywarpppjnalxzmuygqc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5d2FycHBwam5hbHh6bXV5Z3FjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NjAzNTYsImV4cCI6MjEwNzUzNjM1Nn0.MEcVb6JIPzby4jaolyC57Ee_d2j63ixUFUJDdU8daHg';
    const TABLE = 'weapons';
    const CURRENCY = '₸';

    // Сайт открывается только на этом домене (GitHub Pages).
    // Чтобы проверить страницу у себя на компьютере, временно поставьте ''.
    const ALLOWED_HOST = 'github.io';
    // ======================================================

    const app = document.getElementById('app');
    const grid = document.getElementById('grid');
    const stateEl = document.getElementById('state');
    const countEl = document.getElementById('count');
    const searchEl = document.getElementById('search');
    const sortEl = document.getElementById('sort');

    let items = [];

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => (
        {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]
      ));
    }

    function formatPrice(v) {
      const n = Number(v);
      if (Number.isNaN(n)) return '—';
      return n.toLocaleString('ru-RU') + '<small>' + CURRENCY + '</small>';
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const key = sortEl.value;

      const list = items
        .filter(it => !q || `${it.name ?? ''} ${it.type ?? ''}`.toLowerCase().includes(q))
        .sort((a, b) => {
          if (key === 'price') return Number(a.price) - Number(b.price);
          return String(a[key] ?? '').localeCompare(String(b[key] ?? ''), 'ru');
        });

      countEl.innerHTML = 'Найдено лотов: <b>' + String(list.length).padStart(2, '0') + '</b>';

      grid.innerHTML = list.map((it, i) => {
        const inStock = Number(it.quantity) > 0;
        const lot = String(it.id ?? i + 1).padStart(3, '0');
        return `
        <div class="card ${inStock ? '' : 'out'}">
          <div class="lot"><span>ЛОТ #${esc(lot)}</span><em>${inStock ? 'ДОСТУПЕН' : 'ЗАКРЫТ'}</em></div>
          <div class="body">
            <h2>${esc(it.name)}</h2>
            <span class="chip">${esc(it.type)}</span>
            <div class="price">${formatPrice(it.price)}</div>
            ${inStock ? '<div class="stock ok">В наличии: ' + esc(it.quantity) + ' шт.</div>' : '<div class="stock no">&nbsp;</div>'}
          </div>
          ${inStock ? '' : '<div class="stamp">НЕТ В НАЛИЧИИ</div>'}
        </div>`;
      }).join('');

      if (!list.length) {
        stateEl.style.display = 'block';
        stateEl.className = 'state';
        stateEl.textContent = items.length ? 'Ничего не найдено' : 'Склад пуст';
      } else {
        stateEl.style.display = 'none';
      }
    }

    async function load() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*`, {
          headers: {apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`}
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        items = await res.json();
        render();
      } catch (e) {
        stateEl.style.display = 'block';
        stateEl.className = 'state error';
        stateEl.innerHTML = 'Связь потеряна' +
          '<small>Проверьте URL и ключ в настройках скрипта и политику доступа (RLS) на чтение таблицы.<br>' +
          esc(e.message) + '</small>';
      }
    }

    // ---------- запуск ----------
    const host = location.hostname;
    if (ALLOWED_HOST && !(host === ALLOWED_HOST || host.endsWith('.' + ALLOWED_HOST))) {
      app.innerHTML = `
      <div class="lock">
        <h2>ДОСТУП ЗАКРЫТ</h2>
        <p>Этот сайт открывается только через GitHub Pages.</p>
      </div>`;
    } else {
      searchEl.addEventListener('input', render);
      sortEl.addEventListener('change', render);
      load();
    }
  </script>
</body>

</html>
